name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fast-forward production server
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SSH_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/rolanpro_production"
          chmod 600 "$HOME/.ssh/rolanpro_production"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Advance production to verified main commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/rolanpro_production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            runcloud@143.110.136.211 \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          app_dir=/home/runcloud/webapps/rolanpro-crm
          cd "$app_dir"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          git fetch --prune origin main
          fetched_sha="$(git rev-parse origin/main)"
          test "$fetched_sha" = "$EXPECTED_SHA"

          # Database backup BEFORE the new release can run migrations.
          # Any failure here stops the deploy. Keeps the last 30 backups.
          backup_dir=/home/runcloud/backups
          install -d -m 700 "$backup_dir"
          export PATH="/home/runcloud/rolanpro-runtime/bin:$PATH"
          set -a
          . "$app_dir/.env.production.local"
          set +a
          db_url="${DATABASE_URL%%\?*}"
          backup_file="$backup_dir/rolanpro-$(date -u +%Y%m%dT%H%M%SZ)-${EXPECTED_SHA:0:7}.dump"
          pg_dump --format=custom --no-owner --no-privileges --file="$backup_file" "$db_url"
          chmod 600 "$backup_file"
          test -s "$backup_file"
          pg_restore --list "$backup_file" > /dev/null
          echo "Database backup: $backup_file ($(du -h "$backup_file" | cut -f1))"
          ls -1t "$backup_dir"/rolanpro-*.dump | tail -n +31 | xargs -r rm -f

          git merge --ff-only "$fetched_sha"
          REMOTE

      - name: Wait for server deployment
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            deployed_sha="$(ssh -i "$HOME/.ssh/rolanpro_production" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              runcloud@143.110.136.211 \
              "head -n 1 /home/runcloud/.rolanpro-crm-active-release 2>/dev/null | cut -f 1 || true")"
            if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
              curl --fail --silent --show-error --max-time 15 \
                https://rolanpro-crm.143-110-136-211.sslip.io/ >/dev/null
              echo "Production is serving $EXPECTED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not activate $EXPECTED_SHA within 10 minutes" >&2
          exit 1
