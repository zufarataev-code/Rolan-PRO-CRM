name: Codex Bridge

# Мост между Claude и Codex.
#
# Claude ставит задачу или открывает пулл-реквест — Codex отвечает
# сам, без участия владельца. Раньше задачи просто лежали в репозитории:
# Codex не читает GitHub по расписанию, поэтому ответа не появлялось.
#
# Запускается на: новую задачу, новый комментарий с обращением к Codex,
# новый пулл-реквест, и раз в час на случай пропущенного события.

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  respond:
    runs-on: ubuntu-latest
    # Не отвечаем на собственные комментарии, иначе Codex зациклится
    # сам на себе: его ответ создаст событие, которое вызовет новый ответ.
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login != 'github-actions[bot]' &&
       !startsWith(github.event.comment.body, '<!-- codex-bridge -->'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Answer as architect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: bash .agents/bridge/respond.sh
