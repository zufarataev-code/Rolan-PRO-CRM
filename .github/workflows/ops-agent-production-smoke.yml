name: Operations Agent production probe

on:
  push:
    branches:
      - ops/agent-production-smoke-20260928
    paths:
      - .github/workflows/ops-agent-production-smoke.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SSH_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/rolanpro_production"
          chmod 600 "$HOME/.ssh/rolanpro_production"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect production service controls
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/rolanpro_production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            runcloud@143.110.136.211 'bash -s' <<'REMOTE'
          set -euo pipefail
          app_dir=/home/runcloud/webapps/rolanpro-crm
          cd "$app_dir"

          echo 'supervisor_begin'
          supervisorctl status 2>&1 || true
          echo 'supervisor_end'

          echo 'deploy_files_begin'
          find deploy -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort || true
          echo 'deploy_files_end'

          if [ -f deploy/watch-production.sh ]; then
            echo 'watch_script_begin'
            sed -n '1,240p' deploy/watch-production.sh | \
              sed -E 's/(password|token|secret|key)=("[^"]*"|[^ ]+)/\1=[redacted]/Ig'
            echo 'watch_script_end'
          fi

          echo 'supervisor_configs_begin'
          grep -RIl 'rolanpro-crm\|next-server\|npm.*start\|next start' /etc/supervisor 2>/dev/null | head -n 20 || true
          echo 'supervisor_configs_end'
          REMOTE
