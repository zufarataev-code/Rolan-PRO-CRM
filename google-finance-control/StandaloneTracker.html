<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финансовый трекер</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f8f9fa;--bg2:#ffffff;--bg3:#f1f3f5;
  --text:#1a1a2e;--muted:#6c757d;--border:rgba(0,0,0,0.1);
  --accent:#0EA5E9;--green:#10B981;--red:#EF4444;--yellow:#F59E0B;--purple:#8B5CF6;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}
.shell{display:flex;height:100vh;overflow:hidden;}
.sb{width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sb-logo{padding:16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
.sb-icon{width:30px;height:30px;background:#0EA5E9;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;}
.sb-name{font-size:13px;font-weight:700;}
.sb-sub{font-size:9px;color:var(--muted);letter-spacing:1px;}
.sb-nav{flex:1;padding:8px 6px;overflow-y:auto;}
.nb{width:100%;padding:8px 10px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:12px;text-align:left;margin-bottom:2px;transition:all .15s;}
.nb:hover{background:var(--bg3);color:var(--text);}
.nb.on{background:#EFF6FF;color:#1D4ED8;font-weight:600;}
.nb-ic{font-size:16px;width:18px;text-align:center;}
.sb-footer{padding:10px 12px;border-top:1px solid var(--border);}
.sb-alert{font-size:10px;color:var(--muted);padding:5px 7px;margin-bottom:4px;border-radius:0;border-left:2px solid;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:50px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg2);flex-shrink:0;}
.tb-t{font-size:14px;font-weight:700;}
.tb-s{font-size:11px;color:var(--muted);margin-left:10px;}
.content{flex:1;overflow-y:auto;padding:20px;}
.pg{display:none;}
.pg.on{display:block;}
.kgrid{display:grid;gap:12px;margin-bottom:16px;}
.k5{grid-template-columns:repeat(5,1fr);}
.k4{grid-template-columns:repeat(4,1fr);}
.k3{grid-template-columns:repeat(3,1fr);}
.kc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.kc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--kc,#0EA5E9);}
.kl{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.kv{font-size:20px;font-weight:700;color:var(--text);}
.ks{font-size:11px;margin-top:4px;color:var(--kc,#0EA5E9);}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.ch{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.ct{font-size:13px;font-weight:700;}
.cs{font-size:10px;color:var(--muted);}
.cb{padding:14px 16px;}
table{width:100%;border-collapse:collapse;}
th{padding:8px 12px;font-size:10px;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
td{padding:9px 12px;font-size:12px;border-bottom:1px solid rgba(0,0,0,.05);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;}
.btn{cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--bg2);padding:7px 14px;font-size:12px;font-weight:600;color:var(--text);transition:all .15s;}
.btn:hover{background:var(--bg3);}
.btn-p{background:#0EA5E9;color:#fff;border-color:#0EA5E9;}
.btn-p:hover{background:#0284C7;}
.btn-g{background:#10B981;color:#fff;border-color:#10B981;}
.btn-r{background:#EF4444;color:#fff;border-color:#EF4444;}
.btn-sm{padding:4px 10px;font-size:11px;}
input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:#0EA5E9;}
select option{background:var(--bg2);}
textarea{resize:vertical;min-height:70px;}
.fg{display:grid;gap:12px;}
.f2{grid-template-columns:1fr 1fr;}
.f3{grid-template-columns:1fr 1fr 1fr;}
.fl{display:flex;flex-direction:column;gap:5px;}
.fl label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.fl input,.fl select,.fl textarea{width:100%;}
.arow{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.prog{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:5px;}
.bar{height:100%;border-radius:3px;transition:width .4s;}
.alert-box{padding:9px 13px;border-radius:0;border-left:3px solid;font-size:12px;margin-bottom:8px;}
.a-warn{background:#FFFBEB;border-color:#F59E0B;color:#92400E;}
.a-danger{background:#FEF2F2;border-color:#EF4444;color:#991B1B;}
.a-success{background:#F0FDF4;border-color:#10B981;color:#065F46;}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:var(--bg2);border-radius:12px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--border);}
.modal-lg{max-width:680px;}
.mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.mt{font-size:15px;font-weight:700;}
.mb{padding:20px;overflow-y:auto;flex:1;}
.mf{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);flex-shrink:0;}
.info-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.05);}
.info-row:last-child{border-bottom:none;}
.il{font-size:11px;color:var(--muted);}
.iv{font-size:11px;font-weight:700;}
.badge-biz{background:#EFF6FF;color:#1E40AF;}
.badge-pers{background:#F5F3FF;color:#5B21B6;}
.badge-inc{background:#F0FDF4;color:#166534;}
.badge-exp{background:#FEF2F2;color:#991B1B;}
@media(max-width:768px){
  .sb{width:52px;}
  .nb span,.sb-name,.sb-sub,.sb-alert{display:none;}
  .sb-logo{padding:12px;justify-content:center;}
  .nb{justify-content:center;padding:8px;}
  .k5,.k4{grid-template-columns:1fr 1fr;}
  .f3,.f2{grid-template-columns:1fr;}
}
</style>
</head>

function localDateStr(value=new Date()){
  const d=value instanceof Date?value:new Date(value);
  if(isNaN(d.getTime())) return '';
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function readJSON(key, def){
  try{
    const raw=localStorage.getItem(key);
    if(raw==null||raw==='') return def;
    const parsed=JSON.parse(raw);
    return parsed==null?def:parsed;
  }catch(e){
    console.warn('Bad localStorage JSON:', key, e);
    return def;
  }
}

const _mem={};
function _lsOK(){try{localStorage.setItem('_chk','1');localStorage.removeItem('_chk');return true;}catch(e){return false;}}
const _useLS=_lsOK();
function _get(k,def){if(_useLS)return readJSON(k,def);return _mem[k]!==undefined?_mem[k]:def;}
function _set(k,v){
  if(_useLS){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  _mem[k]=v;
  try{const rq=indexedDB.open('fintracker',1);rq.onupgradeneeded=e=>e.target.result.createObjectStore('kv');rq.onsuccess=e=>{try{e.target.result.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(v),k);}catch(e){}};}catch(e){}
}
function _loadFromIDB(cb){
  if(_useLS){cb();return;}
  try{
    const rq=indexedDB.open('fintracker',1);
    rq.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
    rq.onsuccess=e=>{
      const store=e.target.result.transaction('kv','readonly').objectStore('kv');
      let n=0,keys=['ft_txns','ft_subs','ft_accounts'];
      keys.forEach(k=>{const r=store.get(k);r.onsuccess=()=>{if(r.result!=null)_mem[k]=JSON.parse(r.result);if(++n===keys.length)cb();};r.onerror=()=>{if(++n===keys.length)cb();};});
    };
    rq.onerror=()=>cb();
  }catch(e){cb();}
}

function stripeCorrectBalance(){
  const v = prompt('Введи реальный баланс Stripe ($):\n(Все автоимпортированные транзакции будут удалены и заменены на правильную сумму)', '300');
  if(v===null) return;
  const amt = parseFloat(v);
  if(isNaN(amt)||amt<0){alert('Неверная сумма');return;}
  stripeCleanupAndSet(amt);
}

function stripeCleanupAndSet(realBalance){
  // Remove all auto-imported Stripe transactions
  const before = DB.txns.length;
  DB.txns = DB.txns.filter(t => !(t.note && t.note.includes('[stripe:')));
  const removed = before - DB.txns.length;

  // Reset account balances that were inflated by Stripe imports
  // (we can't know exact which accounts were affected, so we just remove the txns)

  // Add single correct entry for current Stripe balance
  if(realBalance > 0){
    const today = localDateStr();
    const acc = DB.accounts.find(a=>a.type!=='credit') || DB.accounts[0];
    DB.txns.push({
      id: Date.now(),
      date: today,
      category: 'Stripe баланс',
      catType: 'income',
      type: 'business',
      amount: realBalance,
      account: acc ? acc.name : '',
      note: 'Текущий баланс Stripe $'+realBalance+' [stripe:balance]'
    });
  }

  saveDB(DB);
  localStorage.removeItem('stripe_cache');
  alert('✅ Готово!\nУдалено транзакций: ' + removed + '\nДобавлен реальный баланс: $' + realBalance);
  renderDash();
  renderStripe();
}

function _getAlertsBase(){
  const a=[];const d=today.getDate();
  DB.subs.filter(s=>s.active).forEach(s=>{
    const diff=s.day-d;
    if(diff>=0&&diff<=3)a.push({type:'warn',msg:`${s.name} — ${fmtD(s.amount)} через ${diff===0?'сегодня':diff+' дн.'}`});
    else if(diff<0&&diff>=-2)a.push({type:'danger',msg:`${s.name} — ${fmtD(s.amount)} (возможно просрочено)`});
  });
  DB.accounts.filter(ac=>ac.type==='credit'&&ac.limit).forEach(ac=>{
    const u=Math.round(Math.abs(ac.balance)/ac.limit*100);
    if(u>80)a.push({type:'danger',msg:`${ac.name} — загрузка ${u}%`});
    else if(u>65)a.push({type:'warn',msg:`${ac.name} — загрузка ${u}%`});
  });
  return a;
}

function addSwitchTab(tab){
  ['exp','inc','cats'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('on',t===tab);
    document.getElementById('add-'+t+'-panel').style.display=t===tab?'block':'none';
  });
  if(tab==='cats'){
    const el=document.getElementById('add-cats-panel');
    if(el) el.innerHTML=renderCatsManager();
  }
}

function addUpdateTags(type){
  const px=type==='expense'?'e':'i';
  const catName=document.getElementById(px+'_cat')?.value||'';
  const catObj=getCatObj(catName,type);
  const tags=loadTags();
  const catTags=tags[catObj.id]||[];
  const container=document.getElementById(px+'_tags_container');
  if(!container) return;
  if(!catTags.length){container.innerHTML='';return;}
  container.innerHTML=`<div style="margin-top:8px">
    <div style="font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">Теги</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px">
      ${catTags.map(t=>`<span class="tag-chip" onclick="toggleTag(this,'${type}')" data-tag="${t.name}" style="--chip-c:${catObj.color||'#0EA5E9'}">${t.icon} ${t.name}</span>`).join('')}
    </div>
  </div>`;
}

function toggleTag(el, type){
  el.classList.toggle('on');
}

function getSelectedTags(type){
  const px=type==='expense'?'e':'i';
  const container=document.getElementById(px+'_tags_container');
  if(!container) return [];
  return Array.from(container.querySelectorAll('.tag-chip.on')).map(el=>el.dataset.tag);
}

function toggleSalaryDetails(catId){
  const el = document.getElementById('salary_details');
  if(!el) return;
  const salaryCategories = ['salary','w2'];
  el.style.display = salaryCategories.includes(catId) ? 'block' : 'none';

  if(dl){
    const tags = loadTags();
    const empTags = tags.salary||[];
    dl.innerHTML = empTags
      .filter(t=>t.id.startsWith('emp'))
      .map(t=>`<option value="${t.name}">`)
      .join('');
  }
}

function addEmployee(catId){
  const name=prompt('Имя сотрудника:');
  if(!name||!name.trim()) return;
  const id='emp_'+Date.now();
  const tags=loadTags();
  if(!tags[catId]) tags[catId]=[];
  tags[catId].push({id,name:name.trim(),icon:'👤'});
  saveTags(tags);
  renderAdd(); addSwitchTab('cats');
}

function addCatPrompt(type){
  const name=prompt('Название категории:');
  if(!name||!name.trim()) return;
  const icon=prompt('Иконка (эмодзи):', '📌')||'📌';
  const color=prompt('Цвет (hex):', '#0EA5E9')||'#0EA5E9';
  const id='cat_'+Date.now();
  if(type==='expense'){
    const cats=loadCatsExp();
    cats.push({id,name:name.trim(),icon,color});
    saveCatsExp(cats);
  } else {
    const cats=loadCatsInc();
    cats.push({id,name:name.trim(),icon,color});
    saveCatsInc(cats);
  }
  renderAdd();
  addSwitchTab('cats');
}

function deleteCat(id, type){
  if(!confirm('Удалить категорию?')) return;
  if(type==='expense'){
    saveCatsExp(loadCatsExp().filter(c=>c.id!==id));
  } else {
    saveCatsInc(loadCatsInc().filter(c=>c.id!==id));
  }
  renderAdd(); addSwitchTab('cats');
}

function addTagPrompt(catId, color){
  const name=prompt('Название тега:');
  if(!name||!name.trim()) return;
  const icon=prompt('Иконка:', '🏷')||'🏷';
  const tags=loadTags();
  if(!tags[catId]) tags[catId]=[];
  tags[catId].push({id:'tag_'+Date.now(), name:name.trim(), icon});
  saveTags(tags);
  renderAdd(); addSwitchTab('cats');
}

function deleteTag(catId, tagId){
  const tags=loadTags();
  if(tags[catId]) tags[catId]=tags[catId].filter(t=>t.id!==tagId);
  saveTags(tags);
  renderAdd(); addSwitchTab('cats');
}


function addTxn(type){
  const px=type==='expense'?'e':'i';
  const amt=parseFloat($(px+'_amt').value);
  if(!amt||amt<=0){$(px+'_msg').innerHTML='<div class="alert-box a-danger" style="margin-top:8px">Введите сумму</div>';return;}
  const accId=parseInt($(px+'_acc').value);
  const acc=DB.accounts.find(a=>a.id===accId);
  const selTags=getSelectedTags(type);
  const catName=$(px+'_cat').value;
  const catObj=getCatObj(catName,type);
  // Salary/payroll extras
  let txnNote=$(px+'_note').value;
  let txnTags=[...selTags];
  if(type==='income'){
    const empName=document.getElementById('i_emp_name')?.value?.trim();
    const payType=document.getElementById('i_pay_type')?.value;
    const payPeriod=document.getElementById('i_pay_period')?.value?.trim();
    if(empName && !txnTags.includes(empName)) txnTags.push(empName);
    if(payType){const ptMap={base:'Базовая зп',bonus:'Бонус',tips:'Чаевые',overtime:'Сверхурочные',advance:'Аванс'};if(ptMap[payType]) txnTags.push(ptMap[payType]);}
    if(payPeriod) txnNote=(txnNote?txnNote+' · ':'')+payPeriod;
  }
  const txn={
    id:Date.now(),
    date:$(px+'_date').value,
    amount:amt,
    catType:type,
    category:catName,
    catIcon:catObj.icon||'📌',
    catColor:catObj.color||'#94A3B8',
    tags:txnTags,
    type:$(px+'_type').value,
    account:acc?.name||'',
    isFixed:$(px+'_fix').value==='yes',
    note:txnNote
  };
  DB.txns.push(txn);
  if(acc){type==='income'?acc.balance+=amt:acc.balance-=amt;}
  saveDB(DB);
  const tagStr=selTags.length?' · '+selTags.join(', '):'';
  $(px+'_msg').innerHTML='<div class="alert-box a-success" style="margin-top:8px">✓ '+fmtD(amt)+' · '+catName+tagStr+'</div>';
  $(px+'_amt').value=''; $(px+'_note').value='';
  // Reset tags
  document.querySelectorAll('#'+px+'_tags_container .tag-chip').forEach(el=>el.classList.remove('on'));
  setTimeout(()=>{if($(px+'_msg'))$(px+'_msg').innerHTML='';},3000);
  renderAlerts();renderDash();renderTxns();
}

function delTxn(id){
  if(!confirm('Удалить операцию?'))return;
  const t=DB.txns.find(x=>x.id===id);
  if(t){
    const acc=DB.accounts.find(a=>a.name===t.account);
    if(acc){t.catType==='income'?acc.balance-=t.amount:acc.balance+=t.amount;}
    DB.txns=DB.txns.filter(x=>x.id!==id);
    saveDB(DB);renderTxns();renderAlerts();
  }
}

  var barColor = util == null ? '#6B7280' : util > 70 ? '#EF4444' : util > 40 ? '#F59E0B' : '#10B981';
  var cardCls  = util == null ? '' : util > 70 ? 'ac-danger' : util > 40 ? 'ac-warn' : '';

function renderAccounts() {
  var p = document.getElementById('pg-accounts');
  var credits = DB.accounts.filter(function(a){ return a.type==='credit'; });
  var debits  = DB.accounts.filter(function(a){ return a.type==='checking'||a.type==='savings'; });
  var totDebt  = credits.reduce(function(s,a){ return s+Math.abs(Math.min(a.balance,0)); }, 0);
  var totLim   = credits.filter(function(a){ return a.limit; }).reduce(function(s,a){ return s+a.limit; }, 0);
  var totAvail = totLim - totDebt;
  var totCash  = debits.reduce(function(s,a){ return s+a.balance; }, 0);
  var overallUtil = totLim>0 ? Math.round(totDebt/totLim*100) : 0;
  var noLimitWarn = credits.filter(function(a){ return !a.limit; }).length;

  var creditCards = credits.map(function(a){ return ccCard(a); }).join('');
  var debitCards  = debits.map(function(a){ return debitCard(a); }).join('');

  p.innerHTML = '<style>'
    + '.ac-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow .15s}'
    + '.ac-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.2)}'
    + '.ac-card.ac-warn{border-color:#F59E0B}'
    + '.ac-card.ac-danger{border-color:#EF4444}'
    + '.ac-edit-row{background:var(--bg3);padding:14px 16px;border-top:1px solid var(--border);display:none}'
    + '.ac-edit-row.open{display:block}'
    + '.ac-edit-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}'
    + '.ac-section-hdr{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px}'
    + '.ac-section-hdr::after{content:"";flex:1;height:1px;background:var(--border)}'
    + '</style>'
    + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">'
    + kpi('Наличные', fmt$(totCash), 'debit + savings', '#10B981')
    + kpi('Кредит. долг', fmt$(totDebt), 'по всем картам', '#EF4444')
    + kpi('Доступно', fmt$(totAvail), 'свободный кредит', totAvail/Math.max(totLim,1)*100>=50?'#10B981':'#F59E0B')
    + kpi('Использ. лимита', overallUtil+'%', totLim>0?'из $'+totLim.toLocaleString('en-US'):'нет лимитов', overallUtil>70?'#EF4444':overallUtil>40?'#F59E0B':'#10B981')
    + '</div>'
    + (noLimitWarn ? '<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#92400E">⚠️ У ' + noLimitWarn + ' карт не задан лимит — нажми ✏️ чтобы добавить</div>' : '')
    + '<div style="display:flex;gap:8px;margin-bottom:16px"><button class="btn btn-p btn-sm" onclick="showAddAccModal()">➕ Добавить счёт / карту</button></div>'
    + (credits.length ? '<div class="ac-section-hdr">💳 Кредитные карты (' + credits.length + ')</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px">' + creditCards + '</div>' : '')
    + (debits.length  ? '<div class="ac-section-hdr">🏦 Дебетовые счета (' + debits.length + ')</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">' + debitCards + '</div>' : '')
    + '<div id="acc-form-wrap" style="margin-top:14px"></div>';
}


function accTopUp(id){
  const v=parseFloat(prompt('Сколько пополнить ($)?'));
  if(!v||v<=0)return;
  const note=prompt('Примечание (Enter чтобы пропустить):')||'';
  const a=DB.accounts.find(x=>x.id===id);
  if(!a)return;
  // Для кредиток пополнение уменьшает долг (баланс становится менее отрицательным)
  if(a.type==='credit') a.balance=Math.min(0, a.balance+v);
  else a.balance+=v;
  accAddHist(id,'in',v,note);
  saveDB(DB);renderAccounts();
}
function accCharge(id){
  const v=parseFloat(prompt('Сколько списать ($)?'));
  if(!v||v<=0)return;
  const note=prompt('Примечание (Enter чтобы пропустить):')||'';
  const a=DB.accounts.find(x=>x.id===id);
  if(!a)return;
  if(a.type==='credit') a.balance=Math.max(-a.limit||a.balance-v, a.balance-v);
  else a.balance-=v;
  accAddHist(id,'out',v,note);
  saveDB(DB);renderAccounts();
}
function accAddHist(id,type,amt,note){
  const hist=readJSON('acc_hist_'+id,[]);
  const d=new Date();
  hist.push({type,amt,note,date:d.getDate()+'.'+(d.getMonth()+1)});
  if(hist.length>20)hist.splice(0,hist.length-20);
  localStorage.setItem('acc_hist_'+id,JSON.stringify(hist));
}
function accToggleEdit(id){
  const el=document.getElementById('ac-edit-'+id);
  if(el)el.classList.toggle('open');
}
function accSaveEdit(id){
  const a=DB.accounts.find(x=>x.id===id);
  if(!a)return;
  a.name=document.getElementById('aen-'+id).value.trim()||a.name;
  a.limit=parseFloat(document.getElementById('ael-'+id).value)||null;
  a.balance=parseFloat(document.getElementById('aeb-'+id).value)||0;
  a.color=document.getElementById('aec-'+id).value||a.color;
  saveDB(DB);renderAccounts();
}
function accDel(id){
  if(!confirm('Удалить счёт?'))return;
  DB.accounts=DB.accounts.filter(a=>a.id!==id);
  localStorage.removeItem('acc_hist_'+id);
  saveDB(DB);renderAccounts();
}

function saveAcc(){
  const n=$('an').value.trim();
  if(!n){alert('Введите название');return;}
  const colors=['#0EA5E9','#10B981','#8B5CF6','#F59E0B','#EF4444'];
  DB.accounts.push({id:Date.now(),name:n,type:$('at').value,balance:parseFloat($('ab').value)||0,limit:parseFloat($('al').value)||null,color:colors[DB.accounts.length%5]});
  saveDB(DB);$('acc-form-wrap').innerHTML='';renderAccounts();
}

  const rows=mo6.map(m=>{
    const mt=DB.txns.filter(t=>{const d=new Date(t.date);return d.getMonth()===m.m&&d.getFullYear()===m.y;});
    const inc=mt.filter(t=>t.catType==='income').reduce((s,t)=>s+t.amount,0);
    const exp=mt.filter(t=>t.catType==='expense').reduce((s,t)=>s+t.amount,0);
    const bizI=mt.filter(t=>t.catType==='income'&&t.type==='business').reduce((s,t)=>s+t.amount,0);
    const bizE=mt.filter(t=>t.catType==='expense'&&t.type==='business').reduce((s,t)=>s+t.amount,0);
    return{...m,inc,exp,net:inc-exp,bizI,bizE};
  });
  const maxVal=Math.max(...rows.flatMap(r=>[r.inc,r.exp]),1);

  // Category breakdown
  const allCats={};

  const mTxns=DB.txns.filter(t=>{const d=new Date(t.date);return d.getMonth()===mo&&d.getFullYear()===yr;});

function importData(e){
  const file=e.target.files[0];
  if(!file)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(d.txns) DB.txns=d.txns;
      if(d.subs) DB.subs=d.subs;
      if(d.accounts) DB.accounts=d.accounts;
      if(d.pc_bills) localStorage.setItem('pc_bills',JSON.stringify(d.pc_bills));
      if(d.stripe_balance) localStorage.setItem('stripe_balance',JSON.stringify(d.stripe_balance));
      // restore paid keys
      if(d.paid_keys) d.paid_keys.forEach(k=>localStorage.setItem(k,'1'));
      saveDB(DB);
      renderDash();renderAlerts();
      const strB=d.stripe_balance;
      const msg='✅ Импорт успешен!\n\nТранзакций: '+DB.txns.length+'\nСчетов: '+DB.accounts.length+(strB?'\n\nStripe баланс: $'+strB.available.toFixed(2)+' доступно':'');
      alert(msg);
    }catch(err){alert('Ошибка чтения файла: '+err.message);}
  };
  r.readAsText(file);
  e.target.value='';
}

function exportGoogleCalendar(){
  const bills = pcLoad();
  const now   = new Date();
  const yr    = now.getFullYear();
  const links = [];

  bills.forEach(b=>{
    // Create recurring event for next 12 months
    for(let m=0;m<12;m++){
      const d = new Date(yr, now.getMonth()+m, b.day);
      if(d < now) continue;
      const yStr  = d.getFullYear();
      const moStr = String(d.getMonth()+1).padStart(2,'0');
      const dStr  = String(d.getDate()).padStart(2,'0');
      const dateF = yStr+''+moStr+''+dStr;
      const emoji = PC_TYPES[b.type]?PC_TYPES[b.type].emoji:'💸';
      const title = encodeURIComponent(emoji+' '+b.label+': '+b.name+' $'+b.amount);
      const details= encodeURIComponent((b.note||PC_TYPES[b.type]?.label||'')+'\nСумма: $'+b.amount+'\nТип: '+(PC_TYPES[b.type]?.label||b.type));
      const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        +'&text='+title
        +'&dates='+dateF+'/'+dateF
        +'&details='+details;
      links.push({name:b.name, date:d.toLocaleDateString('ru-RU'), url});
      break; // just next occurrence
    }
  });

  // Open all in new tabs (or show list)
  if(!links.length){alert('Нет платежей в календаре');return;}

  // Show modal with links
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';

function requestNotifications(){
  if(!('Notification' in window)){alert('Браузер не поддерживает уведомления');return;}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){
      localStorage.setItem('ft_notif','1');
      checkNotifications();
      alert('✅ Уведомления включены! Оставь вкладку открытой для получения напоминаний.');
    } else {
      alert('Уведомления отклонены. Разреши в настройках браузера.');
    }
  });
}

function checkNotifications(){
  if(Notification.permission!=='granted') return;
  const last=localStorage.getItem('ft_notif_date');
  const today2=new Date().toDateString();
  if(last===today2) return;
  localStorage.setItem('ft_notif_date',today2);
  const d=new Date().getDate();
  const soon=DB.subs.filter(s=>s.active&&s.day-d>=0&&s.day-d<=3);
  const overdue=DB.subs.filter(s=>s.active&&s.day-d<0&&s.day-d>=-1);
  if(soon.length>0){
    new Notification('💳 FinTracker — Скоро платежи',{
      body:soon.map(s=>`${s.name}: $${s.amount.toFixed(2)} — ${s.day===d?'сегодня':s.day-d+' дн.'}`).join('\n'),
      icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%230EA5E9"/><text x="16" y="22" font-size="18" text-anchor="middle" fill="white">₴</text></svg>'
    });
  }
  if(overdue.length>0){
    new Notification('⚠️ FinTracker — Проверь платежи',{
      body:overdue.map(s=>`${s.name}: $${s.amount.toFixed(2)}`).join('\n'),
    });
  }
}

if(localStorage.getItem('ft_notif')==='1') setTimeout(checkNotifications, 2000);

function telegramConfig(){
  return {
    token:(localStorage.getItem('ft_tg_token')||'').trim(),
    chat:(localStorage.getItem('ft_tg_chat')||'').trim(),
  };
}

function ensureTelegramConfig(){
  let {token,chat}=telegramConfig();
  if(!token) token=(prompt('Telegram Bot Token:')||'').trim();
  if(!chat) chat=(prompt('Telegram Chat ID:')||'').trim();
  if(!token||!chat) return null;
  localStorage.setItem('ft_tg_token',token);
  localStorage.setItem('ft_tg_chat',chat);
  return {token,chat};
}

async function sendTelegram(text){
  const cfg=ensureTelegramConfig();
  if(!cfg) return false;
  try{
    const r=await fetch('https://api.telegram.org/bot'+encodeURIComponent(cfg.token)+'/sendMessage',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:cfg.chat,text,parse_mode:'Markdown'})
    });
    const d=await r.json();
    return d.ok;
  }catch(e){console.error('TG:',e);return false;}
}

function buildReport(){
  const d=new Date().getDate(),mo2=new Date().getMonth();
  const soon=DB.subs.filter(s=>s.active&&s.day-d>=0&&s.day-d<=5).sort((a,b)=>a.day-b.day);
  const overdue=DB.subs.filter(s=>s.active&&d-s.day>=0&&d-s.day<=1);
  const totInc=DB.txns.filter(t=>new Date(t.date).getMonth()===mo2&&t.catType==='income').reduce((s,t)=>s+t.amount,0);
  const totExp=DB.txns.filter(t=>new Date(t.date).getMonth()===mo2&&t.catType==='expense').reduce((s,t)=>s+t.amount,0);
  const taxAcc=DB.accounts.find(a=>a.name==='Tax Reserve');
  const cash=DB.accounts.filter(a=>a.type!=='credit').reduce((s,a)=>s+a.balance,0);
  const debt=DB.accounts.filter(a=>a.type==='credit').reduce((s,a)=>s+Math.abs(a.balance),0);
  const L=[
    '📊 *FinTracker — Ежедневный отчёт*',
    `📅 ${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}`,
    '',
    '💰 *Этот месяц:*',
    `  Доходы: *$${Math.round(totInc).toLocaleString()}*`,
    `  Расходы: *$${Math.round(totExp).toLocaleString()}*`,
    `  Поток: ${totInc-totExp>=0?'✅':'📉'} *$${Math.round(totInc-totExp).toLocaleString()}*`,
    '',
    '🏦 *Счета:*',
    `  На руках: *$${Math.round(cash).toLocaleString()}*`,
    `  Tax Reserve: *$${Math.round(taxAcc?.balance||0).toLocaleString()}*`,
    `  Долги: *$${Math.round(debt).toLocaleString()}*`,
  ];
  if(overdue.length){L.push('','⚠️ *Проверь платежи:*');overdue.forEach(s=>L.push(`  🔴 ${s.name}: $${s.amount.toFixed(2)}`))}
  if(soon.length){L.push('','🔔 *Скоро (5 дней):*');soon.forEach(s=>L.push(`  ${s.day===d?'🔴':'🟡'} *${s.name}* — $${s.amount.toFixed(2)} (${s.day===d?'сегодня':s.day-d+' дн.'}) · ${s.account}`))}
  else L.push('','✅ Нет срочных платежей');
  return L.join('\n');
}

async function exportTelegramData(){
  const btn=document.querySelector('button[onclick="exportTelegramData()"]');
  const orig=btn?.textContent||'✈️ Telegram';
  if(btn){btn.textContent='⏳...';btn.disabled=true;}
  const ok=await sendTelegram(buildReport());
  if(btn){btn.textContent=orig;btn.disabled=false;}
  ok?alert('✅ Отчёт отправлен в Telegram!'):alert('❌ Не удалось отправить. Проверь Telegram Bot Token и Chat ID.');
}

async function autoRemind(){
  const cfg=telegramConfig();
  if(!cfg.token||!cfg.chat) return;
  const last=localStorage.getItem('ft_tg_date');
  const t=new Date().toDateString();
  if(last===t)return;
  localStorage.setItem('ft_tg_date',t);
  const d=new Date().getDate();
  const soon=DB.subs.filter(s=>s.active&&s.day-d>=0&&s.day-d<=2);

  const L=['🔔 *Напоминание FinTracker:*'];

}

  var acc   = DB.accounts.find(function(a){ return a.id===accId; });

  // Mark as paid
  localStorage.setItem(pcPaidKey(id,y,m), '1');

  // Record transaction in operations
  var catMap = {
    rent:'Аренда/Ипотека', credit:'Кредит/Займ', card:'Кред. карта',
    sub:'Подписки', util:'Коммунальные', insurance:'Страховка',
    save:'Откладываю', edu:'Обучение', invest:'Инвестиции',
    tax:'Налоги', car:'Авто', health:'Здоровье', other:'Другое'
  };
  var category = catMap[bill.type]||bill.type||'Платёж';
  var txnType  = bill.type==='save'?'income':'expense';
  var catType  = txnType;

  var txn = {
    id: Date.now(),
    date: date,
    amount: bill.amount,
    catType: catType,
    category: category,
    type: 'personal',
    account: acc?acc.name:'',
    tags: [bill.name],
    note: (PC_TYPES[bill.type]||{}).label+': '+bill.name+' [calendar]',
    isFixed: true,
    catIcon: (PC_TYPES[bill.type]||{}).emoji||'💸',
    catColor: (PC_TYPES[bill.type]||{}).color||'#94A3B8',
  };
  DB.txns.push(txn);

  // Update account balance
  if(acc){
    var idx2 = DB.accounts.findIndex(function(a){ return a.id===accId; });
    if(idx2>=0){
      if(txnType==='expense') DB.accounts[idx2].balance -= bill.amount;
      else DB.accounts[idx2].balance += bill.amount;
      accAddHist(acc.id, txnType==='expense'?'out':'in', bill.amount, bill.name);
    }
  }

  saveDB(DB);
  btn.closest('div[style*="fixed"]').remove();
  renderPayCal();
  renderDash();
  renderAlerts();

  // Show success
  var toast = document.createElement('div');
  toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10B981;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:99999';
  toast.textContent='✅ '+bill.name+' $'+bill.amount+' → '+( acc?acc.name:'счёт');
  document.body.appendChild(toast);
  setTimeout(function(){ toast.remove(); }, 3000);
}

function pcDaysUntil(day) {
  var now = new Date();
  var t   = new Date(now.getFullYear(), now.getMonth(), day);
  if (t < now) t.setMonth(t.getMonth() + 1);
  return Math.ceil((t - now) / 86400000);
}

function pcDelBill(id) {
  if (!confirm('Удалить платёж?')) return;
  var bills = pcLoad().filter(function(b){ return b.id !== id; });
  pcStore(bills);
  renderPayCal();
}

function pcBuildForm(bill) {
  // bill = null for new, object for edit
  var typeOpts = Object.keys(PC_TYPES).map(function(k){
    var sel = (bill && bill.type === k) ? ' selected' : '';
    return '<option value="'+k+'"'+sel+'>'+PC_TYPES[k].emoji+' '+PC_TYPES[k].label+'</option>';
  }).join('');
  var isEdit = !!bill;
  var title  = isEdit ? '✏️ Редактировать платёж' : '➕ Новый платёж / цель';
  var color  = isEdit ? '#8B5CF6' : '#0EA5E9';
  var btnLbl = isEdit ? 'Сохранить изменения' : 'Добавить';
  var fn     = isEdit ? 'pcSubmitEdit('+bill.id+')' : 'pcSubmitAdd()';
  return '<div style="background:var(--bg2);border:2px solid '+color+';border-radius:10px;padding:16px;margin-top:12px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    + '<strong style="font-size:13px;color:'+color+'">'+title+'</strong>'
    + '<button class="btn btn-sm" onclick="document.getElementById(\'pc-form-wrap\').innerHTML=\'\'">✕</button></div>'
    + '<div class="fg f2">'
    + '<div class="fl"><label>Название *</label><input id="pc_n" placeholder="Аренда, Chase..." value="'+(bill?bill.name:'')+'"></div>'
    + '<div class="fl"><label>Сумма ($) *</label><input id="pc_a" type="number" placeholder="1200" step="0.01" value="'+(bill?bill.amount:'')+'"></div>'
    + '<div class="fl"><label>Тип</label><select id="pc_t">'+typeOpts+'</select></div>'
    + '<div class="fl"><label>День месяца (1–31) *</label><input id="pc_d" type="number" min="1" max="31" placeholder="1" value="'+(bill?bill.day:'')+'"></div>'
    + '</div>'
    + '<div class="fl" style="margin-top:10px"><label>Примечание</label><input id="pc_note" placeholder="Доп. информация..." value="'+(bill?bill.note||'':'')+'"></div>'
    + '<div style="display:flex;gap:8px;margin-top:14px">'
    + '<button class="btn btn-p" style="background:'+color+';border-color:'+color+'" onclick="'+fn+'">'+btnLbl+'</button>'
    + (isEdit ? '<button class="btn btn-r btn-sm" onclick="pcDelBill('+bill.id+')">🗑 Удалить</button>' : '')
    + '<button class="btn" onclick="document.getElementById(\'pc-form-wrap\').innerHTML=\'\'">Отмена</button>'
    + '</div></div>';
}

function pcShowAddForm() {
  var wrap = document.getElementById('pc-form-wrap');
  if (!wrap) return;
  wrap.innerHTML = pcBuildForm(null);
  wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function pcShowEditForm(id) {
  var bill = pcLoad().find(function(b){ return b.id === id; });
  if (!bill) return;
  var wrap = document.getElementById('pc-form-wrap');
  if (!wrap) return;
  wrap.innerHTML = pcBuildForm(bill);
  wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function pcSubmitAdd() {
  var n = (document.getElementById('pc_n')||{}).value || '';
  var a = parseFloat((document.getElementById('pc_a')||{}).value);
  var d = parseInt((document.getElementById('pc_d')||{}).value);
  var t = (document.getElementById('pc_t')||{}).value || 'sub';
  var note = (document.getElementById('pc_note')||{}).value || '';
  n = n.trim();
  if (!n || !a || !d || d < 1 || d > 31) { alert('Заполните все поля (день 1–31)'); return; }
  var bills = pcLoad();
  bills.push({id: Date.now(), name: n, amount: a, day: d, type: t, note: note.trim()});
  pcStore(bills);
  document.getElementById('pc-form-wrap').innerHTML = '';
  renderPayCal();
}

function pcSubmitEdit(id) {
  var n = (document.getElementById('pc_n')||{}).value || '';
  var a = parseFloat((document.getElementById('pc_a')||{}).value);
  var d = parseInt((document.getElementById('pc_d')||{}).value);
  var t = (document.getElementById('pc_t')||{}).value || 'sub';
  var note = (document.getElementById('pc_note')||{}).value || '';
  n = n.trim();
  if (!n || !a || !d || d < 1 || d > 31) { alert('Заполните все поля (день 1–31)'); return; }
  var bills = pcLoad().map(function(b){
    return b.id === id ? {id:b.id, name:n, amount:a, day:d, type:t, note:note.trim()} : b;
  });
  pcStore(bills);
  document.getElementById('pc-form-wrap').innerHTML = '';
  renderPayCal();
}

function pcSelectDay(d) {
  pcSelDay = d;
  renderPayCal();
}

function renderPayCal() {
  var p = document.getElementById('pg-paycal');
  if (!p) return;
  var bills = pcLoad();
  var now   = new Date();
  var totMonth = bills.filter(function(b){ return b.type !== 'save'; }).reduce(function(s,b){ return s+b.amount; }, 0);
  var totSave  = bills.filter(function(b){ return b.type === 'save'; }).reduce(function(s,b){ return s+b.amount; }, 0);
  var upcoming7 = bills.filter(function(b){ return pcDaysUntil(b.day) <= 7 && b.type !== 'save'; }).length;
  var urgentBills = bills.filter(function(b){ return pcDaysUntil(b.day) <= 3 && !pcIsPaid(b.id, now.getFullYear(), now.getMonth()); });

  var alertHtml = '';
  if (urgentBills.length) {
    var urgTxt = urgentBills.map(function(b){
      var du = pcDaysUntil(b.day);
      return PC_TYPES[b.type].emoji+' '+b.name+' $'+b.amount.toFixed(2)+' · '+(du<=0?'сегодня':'через '+du+' дн.');
    }).join(' &nbsp;·&nbsp; ');
    alertHtml = '<div class="alert-box a-danger" style="margin-bottom:12px">⚠️ Срочно: '+urgTxt+'</div>';
  }

  p.innerHTML = pcStyles()
    + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">'
    + pcKpi('Платежи / месяц', '$'+Math.round(totMonth).toLocaleString('en-US'), '#EF4444')
    + pcKpi('Откладываю / мес', '$'+Math.round(totSave).toLocaleString('en-US'), '#10B981')
    + pcKpi('Ближайшие 7 дней', upcoming7+' платежей', '#F59E0B')
    + pcKpi('Всего / год', '$'+Math.round((totMonth+totSave)*12).toLocaleString('en-US'), '#8B5CF6')
    + '</div>'
    + alertHtml
    + '<div style="display:flex;gap:6px;margin-bottom:12px;align-items:center">'
    + pcVBtn('Оба вида', 'both') + pcVBtn('📅 Календарь', 'cal') + pcVBtn('📋 Список', 'list')
    + '<button class="btn btn-sm" onclick="pcShowAddForm()" style="margin-left:auto;background:#EFF6FF;border-color:#0EA5E9;color:#1D4ED8">➕ Добавить</button>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 300px;gap:16px">'
    + '<div>'
    + (pcViewMode==='cal'||pcViewMode==='both' ? pcBuildCalendar(bills) : '')
    + (pcViewMode==='list'||pcViewMode==='both' ? pcBuildList(bills) : '')
    + '<div id="pc-form-wrap"></div>'
    + '</div>'
    + '<div>'
    + pcDayDetail(bills)
    + pcBuildUpcoming(bills)
    + pcBuildSummary(bills)
    + pcBuildSavings(bills)
    + '</div>'
    + '</div>';
}

function pcVBtn(label, mode) {
  var on = pcViewMode === mode ? 'background:#EFF6FF;border-color:#0EA5E9;color:#1D4ED8;' : '';
  return '<button class="btn btn-sm" style="'+on+'" onclick="pcViewMode=\''+mode+'\';renderPayCal()">'+label+'</button>';
}

function pcKpi(label, val, color) {
  return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden">'
    + '<div style="height:3px;background:'+color+';position:absolute;bottom:0;left:0;right:0"></div>'
    + '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">'+label+'</div>'
    + '<div style="font-size:18px;font-weight:700;color:'+color+'">'+val+'</div>'
    + '</div>';
}

function pcBuildCalendar(bills) {
  var now = new Date();
  var daysInMonth = new Date(pcCalYear, pcCalMonth+1, 0).getDate();
  var firstDay    = new Date(pcCalYear, pcCalMonth, 1).getDay();
  var offset      = (firstDay + 6) % 7;
  var prevDays    = new Date(pcCalYear, pcCalMonth, 0).getDate();

  var cells = '';
  for (var i=0; i<offset; i++) {
    cells += '<div style="min-height:70px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:4px;opacity:.25"><div style="font-size:10px;color:var(--muted)">'+(prevDays-offset+1+i)+'</div></div>';
  }
  for (var d=1; d<=daysInMonth; d++) {
    var dayBills = bills.filter(function(b){ return b.day===d; });
    var isToday  = d===now.getDate() && pcCalMonth===now.getMonth() && pcCalYear===now.getFullYear();
    var isSel    = d === pcSelDay;
    var border   = isSel ? '#8B5CF6' : isToday ? '#0EA5E9' : 'var(--border)';
    var bg       = isSel ? 'rgba(139,92,246,.07)' : isToday ? '#EFF6FF' : 'var(--bg2)';
    var chips = dayBills.slice(0,3).map(function(b){
      var c = PC_TYPES[b.type] ? PC_TYPES[b.type].color : '#888';
      var paid = pcIsPaid(b.id, pcCalYear, pcCalMonth);
      return '<span style="display:block;font-size:8px;padding:1px 4px;border-radius:3px;margin-bottom:1px;background:'+c+'22;color:'+c+';'+(paid?'opacity:.35':'')+'white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
        + (PC_TYPES[b.type]?PC_TYPES[b.type].emoji:'')+' '+(b.name.length>8?b.name.slice(0,7)+'…':b.name)+'</span>';
    }).join('');
    var numColor = isToday ? '#0EA5E9' : 'var(--muted)';
    var numWeight = isToday ? '700' : '400';
    cells += '<div onclick="pcSelectDay('+d+')" style="min-height:70px;background:'+bg+';border:1px solid '+border+';border-radius:6px;padding:4px;cursor:pointer;transition:all .12s" '
      +'onmouseover="this.style.borderColor=\'#0EA5E9\'" onmouseout="this.style.borderColor=\''+border+'\'">'
      +'<div style="font-size:10px;color:'+numColor+';font-weight:'+numWeight+';font-family:monospace;margin-bottom:2px">'+d+'</div>'
      +chips+'</div>';
  }
  var rem = 42 - offset - daysInMonth;
  for (var j=1; j<=rem; j++) {
    cells += '<div style="min-height:70px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:4px;opacity:.25"><div style="font-size:10px;color:var(--muted)">'+j+'</div></div>';
  }

  return '<div style="margin-bottom:16px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    +'<div style="font-size:16px;font-weight:700">'+MONTHS_PC[pcCalMonth]+' '+pcCalYear+'</div>'
    +'<div style="display:flex;gap:5px">'
    +'<button class="btn btn-sm" onclick="pcCalMonth--;if(pcCalMonth<0){pcCalMonth=11;pcCalYear--;}pcSelDay=null;renderPayCal()">‹</button>'
    +'<button class="btn btn-sm" onclick="pcCalMonth++;if(pcCalMonth>11){pcCalMonth=0;pcCalYear++;}pcSelDay=null;renderPayCal()">›</button>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">'
    +DAYS_PC.map(function(d){ return '<div style="text-align:center;font-size:9px;color:var(--muted);padding:5px 0;text-transform:uppercase;letter-spacing:1px">'+d+'</div>'; }).join('')
    +cells+'</div></div>';
}

function pcBuildList(bills) {
  var now = new Date();
  var sorted = bills.slice().sort(function(a,b){ return a.day-b.day; });
  var rows = sorted.map(function(b){
    var du   = pcDaysUntil(b.day);
    var paid = pcIsPaid(b.id, now.getFullYear(), now.getMonth());
    var c    = PC_TYPES[b.type] ? PC_TYPES[b.type].color : '#888';
    var borderL = (!paid && du<=0) ? '3px solid #EF4444' : (!paid && du<=3) ? '3px solid #F59E0B' : '1px solid var(--border)';
    var statusHtml = paid ? '✅ Оплачен' : du<=0 ? '<span style="color:#EF4444">🔴 Сегодня</span>' : du<=3 ? '<span style="color:#F59E0B">🟡 Через '+du+' дн.</span>' : 'Через '+du+' дн.';
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg2);border-left:'+borderL+';border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:8px;margin-bottom:5px;'+(paid?'opacity:.45':'')+'">'
      +'<div style="width:32px;height:32px;border-radius:7px;background:'+c+'22;color:'+c+';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;font-family:monospace">'+b.day+'</div>'
      +'<div style="flex:1">'
      +'<div style="font-size:12px;font-weight:600">'+(PC_TYPES[b.type]?PC_TYPES[b.type].emoji:'')+' '+b.name+'</div>'
      +'<div style="font-size:10px;color:var(--muted);margin-top:1px">'
      +'<span style="background:'+c+'22;color:'+c+';padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700">'+(PC_TYPES[b.type]?PC_TYPES[b.type].label:'')+'</span>'
      +(b.note?' · '+b.note:'')+' · '+statusHtml+'</div></div>'
      +'<div style="font-size:14px;font-weight:700;font-family:monospace;color:'+c+'">$'+b.amount.toFixed(2)+'</div>'
      +'<div onclick="pcTogglePaid('+b.id+','+now.getFullYear()+','+now.getMonth()+')" style="width:22px;height:22px;border-radius:5px;border:1.5px solid '+(paid?'#10B981':'var(--border)')+';background:'+(paid?'#10B981':'transparent')+';cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;transition:all .12s">'+(paid?'✓':'')+'</div>'
      +'<button onclick="pcShowEditForm('+b.id+')" style="background:none;border:none;color:#0EA5E9;cursor:pointer;font-size:12px;padding:2px 4px;flex-shrink:0" title="Редактировать">✏️</button>'
      +'<button onclick="pcDelBill('+b.id+')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px;flex-shrink:0" title="Удалить">✕</button>'
      +'</div>';
  }).join('');
  return '<div style="margin-bottom:12px">'+rows+'</div>';
}

function pcDayDetail(bills) {
  if (!pcSelDay) return '';
  var now  = new Date();
  var dayB = bills.filter(function(b){ return b.day === pcSelDay; });
  var rows = dayB.length === 0
    ? '<div style="font-size:11px;color:var(--muted)">Нет платежей в этот день</div>'
    : dayB.map(function(b){
        var paid = pcIsPaid(b.id, now.getFullYear(), now.getMonth());
        var c    = PC_TYPES[b.type] ? PC_TYPES[b.type].color : '#888';
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'
          +'<span style="font-size:16px">'+(PC_TYPES[b.type]?PC_TYPES[b.type].emoji:'')+'</span>'
          +'<div style="flex:1"><div style="font-size:12px;font-weight:600;'+(paid?'opacity:.5':'')+'">'+b.name+'</div>'
          +'<div style="font-size:10px;color:var(--muted)">'+(b.note||PC_TYPES[b.type].label)+'</div></div>'
          +'<span style="font-size:13px;font-weight:700;color:'+c+';font-family:monospace">$'+b.amount.toFixed(2)+'</span>'
          +'<div onclick="pcTogglePaid('+b.id+','+now.getFullYear()+','+now.getMonth()+')" style="width:22px;height:22px;border-radius:5px;border:1.5px solid '+(paid?'#10B981':'var(--border)')+';background:'+(paid?'#10B981':'transparent')+';cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0">'+(paid?'✓':'')+'</div>'
          +'<button onclick="pcShowEditForm('+b.id+')" style="background:none;border:none;color:#0EA5E9;cursor:pointer;font-size:11px;padding:2px 4px;flex-shrink:0" title="Редактировать">✏️</button>'
          +'</div>';
      }).join('');
  return '<div style="background:var(--bg2);border:1px solid #8B5CF6;border-radius:10px;padding:12px 14px;margin-bottom:12px">'
    +'<div style="font-size:12px;font-weight:700;color:#8B5CF6;margin-bottom:8px">'+pcSelDay+' '+MONTHS_PC[pcCalMonth]+'</div>'
    +rows+'</div>';
}

function pcBuildUpcoming(bills) {
  var now    = new Date();
  var sorted = bills.filter(function(b){ return b.type!=='save'; })
    .slice().sort(function(a,b){ return pcDaysUntil(a.day)-pcDaysUntil(b.day); }).slice(0,6);
  var rows = sorted.map(function(b){
    var du   = pcDaysUntil(b.day);
    var paid = pcIsPaid(b.id, now.getFullYear(), now.getMonth());
    var c    = PC_TYPES[b.type] ? PC_TYPES[b.type].color : '#888';
    var daysTxt = paid ? '✅ Оплачен' : du<=0 ? '🔴 Сегодня' : du<=3 ? '🟡 '+du+' дн.' : b.day+'-го · '+du+' дн.';
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'
      +'<div style="width:7px;height:7px;border-radius:50%;background:'+c+';flex-shrink:0"></div>'
      +'<div style="flex:1"><div style="font-size:11px;font-weight:600">'+b.name+'</div>'
      +'<div style="font-size:10px;color:var(--muted)">'+daysTxt+'</div></div>'
      +'<div style="font-size:11px;font-weight:700;font-family:monospace;color:'+c+'">$'+b.amount.toFixed(2)+'</div>'
      +'</div>';
  }).join('');
  return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden">'
    +'<div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700">⚡ Ближайшие платежи</div>'
    +'<div style="padding:8px 14px">'+rows+'</div></div>';
}

function pcBuildSummary(bills) {
  var items = Object.keys(PC_TYPES).map(function(t){
    return {t:t, total: bills.filter(function(b){ return b.type===t; }).reduce(function(s,b){ return s+b.amount; },0)};
  }).filter(function(x){ return x.total>0; });
  var cards = items.map(function(x){
    var c = PC_TYPES[x.t].color;
    return '<div style="background:var(--bg3);border-radius:6px;padding:8px 10px">'
      +'<div style="font-size:15px;font-weight:700;font-family:monospace;color:'+c+'">$'+Math.round(x.total).toLocaleString('en-US')+'</div>'
      +'<div style="font-size:9px;color:var(--muted);margin-top:1px">'+PC_TYPES[x.t].emoji+' '+PC_TYPES[x.t].label+'</div>'
      +'</div>';
  }).join('');
  return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden">'
    +'<div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700">📊 Итого по типам / мес</div>'
    +'<div style="padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px">'+cards+'</div></div>';
}

function pcBuildSavings(bills) {
  var saves = bills.filter(function(b){ return b.type==='save'; });
  if (!saves.length) return '';
  var rows = saves.map(function(b){
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'
      +'<span style="font-size:16px">🏦</span>'

function updateTrPreview(){
  const fromId=parseInt((document.getElementById('tr-from')||{}).value);
  const toId=parseInt((document.getElementById('tr-to')||{}).value);
  const amt=parseFloat((document.getElementById('tr-amt')||{}).value);
  const prev=document.getElementById('tr-preview');
  if(!prev) return;
  if(!amt||fromId===toId){prev.style.display='none';return;}
  const from=DB.accounts.find(a=>a.id===fromId);
  const to=DB.accounts.find(a=>a.id===toId);
  if(!from||!to){prev.style.display='none';return;}
  const fromAfter=from.type==='credit'?from.balance-amt:from.balance-amt;
  const toAfter=to.type==='credit'?Math.min(0,to.balance+amt):to.balance+amt;
  prev.style.display='block';
  prev.innerHTML=`<strong>Предпросмотр:</strong><br>
    ${from.name}: <span style="color:#EF4444">$${from.balance.toFixed(2)}</span> → <strong style="color:${fromAfter<0&&from.type!=='credit'?'#EF4444':'#0EA5E9'}">$${fromAfter.toFixed(2)}</strong><br>
    ${to.name}: <span style="color:var(--muted)">$${to.balance.toFixed(2)}</span> → <strong style="color:#10B981">$${toAfter.toFixed(2)}</strong>`;
}

function doTransfer(){
  const fromId=parseInt((document.getElementById('tr-from')||{}).value);
  const toId=parseInt((document.getElementById('tr-to')||{}).value);
  const amt=parseFloat((document.getElementById('tr-amt')||{}).value);
  const note=(document.getElementById('tr-note')||{}).value||'';
  if(!amt||amt<=0){alert('Введите сумму');return;}
  if(fromId===toId){alert('Выберите разные счета');return;}
  const from=DB.accounts.find(a=>a.id===fromId);
  const to=DB.accounts.find(a=>a.id===toId);
  if(!from||!to) return;

  // Списываем откуда
  if(from.type==='credit') from.balance-=amt;      // увеличиваем долг
  else from.balance-=amt;

  // Зачисляем куда
  if(to.type==='credit') to.balance=Math.min(0,to.balance+amt); // погашаем долг
  else to.balance+=amt;

  // История для обоих счетов
  accAddHist(fromId,'out',amt,'→ '+to.name+(note?' · '+note:''));
  accAddHist(toId,'in',amt,'← '+from.name+(note?' · '+note:''));

  // Сохраняем перевод
  const transfers=loadTransfers();
  const d=new Date();
  transfers.push({
    id:Date.now(), from:fromId, to:toId, amount:amt,
    note:note, date:localDateStr(d)
  });
  saveTransfers(transfers);
  saveDB(DB);

  alert(`✅ Перевод выполнен!\n$${amt.toFixed(2)} из "${from.name}" → "${to.name}"`);
  renderTransfer();
  renderAlerts();
}

function delTransfer(id){
  if(!confirm('Удалить запись о переводе? Балансы счетов не изменятся.'))return;
  const transfers=loadTransfers().filter(t=>t.id!==id);
  saveTransfers(transfers);
  renderTransfer();
}

function stImportAll(){
  const lc=stripeCache();
  if(!lc) return;
  const charges=(lc.data.charges||{}).data||[];
  const accId=parseInt((document.getElementById('st-default-acc')||{}).value)||0;
  const acc=DB.accounts.find(a=>a.id===accId)||DB.accounts[0];
  if(!acc){alert('Выбери счёт');return;}
  let imported=0, total=0;
  charges.filter(c=>c.paid&&!c.refunded).forEach(c=>{
    if(DB.txns.find(t=>t.note&&t.note.includes('[stripe:'+c.id+']'))) return;
    const amt=c.amount/100;
    const date=localDateStr(new Date(c.created*1000));
    const desc=c.description||c.billing_details?.name||'Stripe платёж';
    // Check per-row select for this charge
    const rowSel=document.getElementById('acc-sel-'+c.id);
    const rowAccId=rowSel?parseInt(rowSel.value):acc.id;
    const rowAcc=DB.accounts.find(a=>a.id===rowAccId)||acc;
    DB.txns.push({id:Date.now()+imported,date,category:'Stripe доход',catType:'income',type:'business',amount:amt,account:rowAcc.name,note:desc+' [stripe:'+c.id+']'});
    rowAcc.balance+=amt;
    accAddHist(rowAcc.id,'in',amt,'Stripe: '+desc);
    imported++;total+=amt;
  });
  saveDB(DB);
  alert(`✅ Записано ${imported} транзакций на $${total.toFixed(2)} → ${acc.name}`);
  renderStripe();renderAlerts();
}

// Stripe bank account → tracker account mapping
// Key: last 4 digits of bank account, Value: tracker account name
function stripeAccMap(){return readJSON('stripe_acc_map',{});}
function stripeSaveAccMap(m){
  localStorage.setItem('stripe_acc_map',JSON.stringify(m));
}
function stripeGuessAccount(payout){
  const map=stripeAccMap();
  // Try to match by last4 of destination bank account
  const last4=payout?.destination?.bank_account?.last4||payout?.bank_account?.last4||'';
  if(last4&&map[last4]){
    const acc=DB.accounts.find(a=>a.name===map[last4]);
    if(acc) return acc;
  }
  // Fallback: find first non-credit account
  return DB.accounts.find(a=>a.type!=='credit')||DB.accounts[0];
}

async function stLiveFetch(){
  let key=stripeKey();
  if(!key) key=promptStripeKey();
  if(!key) return;

  const hdr={'Authorization':'Bearer '+key};
  const sc=document.getElementById('st-live-status');
  const loadTxt=document.getElementById('st-loading-txt');
  const loadErr=document.getElementById('st-load-err');

  if(sc) sc.innerHTML='<span style="color:#F59E0B">⏳ Загружаю...</span>';
  if(loadTxt) loadTxt.textContent='Загружаю данные из Stripe...';

  try{
    // Test connection first
    const testR = await fetch('https://api.stripe.com/v1/balance',{headers:hdr});
    if(!testR.ok){
      const errD = await testR.json().catch(()=>({}));
      if(sc) sc.innerHTML='<span style="color:#EF4444">❌ Stripe: '+(errD.error?.message||'Auth error '+testR.status)+'</span>';
      if(loadErr) loadErr.textContent='Ошибка: '+(errD.error?.message||testR.status)+'. Проверьте ключ API.';
      return;
    }
    // Fetch balance, charges, payouts AND external bank accounts
    const [balR,chR,pyR,extR]=await Promise.all([
      fetch('https://api.stripe.com/v1/balance',{headers:hdr}),
      fetch('https://api.stripe.com/v1/charges?limit=50',{headers:hdr}),
      fetch('https://api.stripe.com/v1/payouts?limit=20',{headers:hdr}),
      fetch('https://api.stripe.com/v1/accounts',{headers:hdr}).catch(()=>({json:()=>({})})),
    ]);

    const [bal,ch,py]=await Promise.all([balR.json(),chR.json(),pyR.json()]);
    const ext=await extR.json().catch(()=>({}));

    if(bal.error) throw new Error(bal.error.message);

    // Extract external bank accounts from Stripe
    const extAccounts=ext?.external_accounts?.data||[];
    const bankAccounts=extAccounts.filter(a=>a.object==='bank_account');

    // Auto-build mapping if we have bank accounts
    if(bankAccounts.length){
      const map=stripeAccMap();
      bankAccounts.forEach(ba=>{
        if(!map[ba.last4]){
          // Try to auto-match to tracker account by bank name
          const bankLower=(ba.bank_name||'').toLowerCase();
          const matched=DB.accounts.find(a=>{
            const n=a.name.toLowerCase();
            return n.includes('chase')&&bankLower.includes('chase')
              || n.includes('bank of america')&&(bankLower.includes('bank of america')||bankLower.includes('bofa'))
              || n.includes('bmo')&&bankLower.includes('bmo');
          });
          if(matched) map[ba.last4]=matched.name;
        }
      });
      stripeSaveAccMap(map);
    }

    const combined={balance:bal,charges:ch,payouts:py,bankAccounts,fetched:new Date().toISOString()};
    stripeSaveCache(combined);

    const avail=(bal.available||[]).filter(b=>b.currency==='usd').reduce((s,b)=>s+b.amount,0)/100;
    const pend=(bal.pending||[]).filter(b=>b.currency==='usd').reduce((s,b)=>s+b.amount,0)/100;
    localStorage.setItem('stripe_balance',JSON.stringify({
      available:avail, pending:pend,
      updated:new Date().toLocaleDateString('ru-RU')
    }));

    if(sc) sc.innerHTML='<span style="color:#10B981">✅ '+new Date().toLocaleTimeString('ru-RU')+'</span>';
    renderStripe();
    renderDash();

  }catch(e){
    const errMsg='❌ '+e.message;
    if(sc) sc.innerHTML='<span style="color:#EF4444">'+errMsg+'</span>';
    if(loadErr) loadErr.innerHTML='<div style="color:#EF4444;font-size:12px;margin-bottom:10px">'+errMsg+'</div>';
    console.error('Stripe error:', e);
  }
}

function parseCSV(text){
  const rows=[];
  let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(quoted){
      if(ch==='"'&&next==='"'){cell+='"';i++;continue;}
      if(ch==='"'){quoted=false;continue;}
      cell+=ch;
      continue;
    }
    if(ch==='"'){quoted=true;continue;}
    if(ch===','){row.push(cell);cell='';continue;}
    if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';continue;}
    if(ch!=='\r') cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()));
}

function stImportCSV(e){
  const file=e.target.files[0];
  if(!file) return;
  const accId=parseInt((document.getElementById('st-csv-acc')||{}).value);
  const acc=DB.accounts.find(a=>a.id===accId)||DB.accounts[0];
  const r=new FileReader();
  r.onload=function(ev){
    const rows=parseCSV(ev.target.result);
    if(!rows.length) return;
    const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
    let imported=0, skipped=0, total=0;
    for(let i=1;i<rows.length;i++){
      const cols=rows[i].map(c=>String(c||'').trim());
      const row={};
      headers.forEach((h,idx)=>row[h]=cols[idx]||'');
      // Stripe CSV columns: id, created(utc), amount, fee, currency, description, status
      const id=row['id']||row['charge id']||'';
      const status=(row['status']||row['payment status']||'').toLowerCase();
      if(status==='failed'||status==='refunded'){skipped++;continue;}
      const amtRaw=parseFloat(row['amount']||row['gross']||'0');
      if(!amtRaw||amtRaw<=0){skipped++;continue;}
      // Check duplicate
      if(DB.txns.find(t=>t.note&&t.note.includes('[stripe:'+id+']'))){skipped++;continue;}
      const dateRaw=row['created (utc)']||row['date']||row['created']||localDateStr();
      const dateStr=dateRaw.slice(0,10);
      const desc=row['description']||row['customer description']||row['customer email']||'Stripe платёж';
      const amt=amtRaw/100; // Stripe amounts are in cents
      DB.txns.push({id:Date.now()+i,date:dateStr,category:'Stripe доход',catType:'income',type:'business',amount:amt,account:acc?.name||'',note:desc+(id?' [stripe:'+id+']':'')});
      if(acc) acc.balance+=amt;
      imported++;
      total+=amt;
    }
    saveDB(DB);
    const res=document.getElementById('st-csv-result');
    if(res) res.innerHTML=`<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;margin-top:10px">
      ✅ Импортировано <strong>${imported}</strong> транзакций на сумму <strong>$${total.toFixed(2)}</strong><br>
      Пропущено (дубли/ошибки): ${skipped}
    </div>`;
    renderAlerts();
    setTimeout(()=>stTab('history'),1500);
  };
  r.readAsText(file);
  e.target.value='';
}

function stImportPayout(id, amt, date){
  const sel=document.getElementById('py-sel-'+id);
  const accId=sel?parseInt(sel.value):0;
  const acc=DB.accounts.find(a=>a.id===accId)||DB.accounts.find(a=>a.type!=='credit')||DB.accounts[0];
  if(!acc){alert('Выбери счёт');return;}
  if(DB.txns.find(t=>t.note&&t.note.includes('[payout:'+id+']'))){alert('Уже записан');return;}
  DB.txns.push({id:Date.now(),date,category:'Stripe выплата',catType:'income',type:'business',
    amount:amt,account:acc.name,note:'Stripe payout [payout:'+id+']'});
  acc.balance+=amt;
  accAddHist(acc.id,'in',amt,'Stripe выплата');
  saveDB(DB);
  // Save mapping for future
  const lc=stripeCache();
  if(lc){
    const py=(lc.data.payouts||{}).data?.find(p=>p.id===id);
    if(py){
      const last4=py.destination?.bank_account?.last4||py.bank_account?.last4||'';
      if(last4){const map=stripeAccMap();map[last4]=acc.name;stripeSaveAccMap(map);}
    }
  }
  alert('✅ Выплата $'+amt.toFixed(2)+' → '+acc.name);
  renderStripe();
}

function stSaveBankMap(){
  const map=stripeAccMap();
  for(let i=0;i<5;i++){
    const l4=document.getElementById('bmap-last4-'+i);
    const ac=document.getElementById('bmap-acc-'+i);
    if(l4&&ac&&l4.value.trim().length===4){
      map[l4.value.trim()]=ac.value;
    }
  }
  stripeSaveAccMap(map);
  alert('✅ Привязка сохранена!\n'+Object.entries(map).map(([k,v])=>'****'+k+' → '+v).join('\n'));
}

function stDelTxn(id){
  if(!confirm('Удалить транзакцию Stripe?')) return;
  const t=DB.txns.find(x=>x.id===id);
  if(t){
    const acc=DB.accounts.find(a=>a.name===t.account);
    if(acc) t.catType==='income'?acc.balance-=t.amount:acc.balance+=t.amount;
    DB.txns=DB.txns.filter(x=>x.id!==id);
    saveDB(DB);
    stTab('history');
  }
}

function bgSave(){

  if(!cat||!amt||amt<=0){alert('Заполни категорию и сумму');return;}
  const budgets=loadBudgets();

  budgets.push({
    id:Date.now(), category:cat, amount:amt,

//  TAX CALCULATOR MODULE — Self-Employed CA
// ═══════════════════════════════════════════

// 2024 Federal Tax Brackets (Single)
const FED_BRACKETS_SINGLE=[
  {min:0,      max:11600,  rate:0.10},
  {min:11600,  max:47150,  rate:0.12},
  {min:47150,  max:100525, rate:0.22},
  {min:100525, max:191950, rate:0.24},
  {min:191950, max:243725, rate:0.32},
  {min:243725, max:609350, rate:0.35},
  {min:609350, max:Infinity,rate:0.37},
];
const FED_BRACKETS_MARRIED=[
  {min:0,      max:23200,  rate:0.10},
  {min:23200,  max:94300,  rate:0.12},
  {min:94300,  max:201050, rate:0.22},
  {min:201050, max:383900, rate:0.24},
  {min:383900, max:487450, rate:0.32},
  {min:487450, max:731200, rate:0.35},
  {min:731200, max:Infinity,rate:0.37},
];
// CA State Tax Brackets 2024 (Single)
const CA_BRACKETS_SINGLE=[
  {min:0,      max:10412,  rate:0.01},
  {min:10412,  max:24684,  rate:0.02},
  {min:24684,  max:38959,  rate:0.04},
  {min:38959,  max:54081,  rate:0.06},
  {min:54081,  max:68350,  rate:0.08},
  {min:68350,  max:349137, rate:0.093},
  {min:349137, max:418961, rate:0.103},
  {min:418961, max:698274, rate:0.113},
  {min:698274, max:Infinity,rate:0.123},
];
const STANDARD_DEDUCTION={single:14600,married:29200,hoh:21900};

function calcTax(income, brackets){
  let tax=0;
  for(const b of brackets){
    if(income<=b.min) break;
    tax+=(Math.min(income,b.max)-b.min)*b.rate;
  }
  return tax;
}

function calcAllTaxes(grossIncome, settings){
  const deductionAmt=settings.deductions==='standard'
    ? STANDARD_DEDUCTION[settings.filingStatus]||14600
    : settings.itemizedAmt||0;

  // Self-employment tax (15.3% on 92.35% of net)
  const seTaxBase=grossIncome*0.9235;
  const seTax=seTaxBase*0.153;
  const seDeduction=seTax/2; // deductible half

  const agi=Math.max(0, grossIncome - seDeduction);
  const taxableIncome=Math.max(0, agi - deductionAmt);

  const brackets=settings.filingStatus==='married'?FED_BRACKETS_MARRIED:FED_BRACKETS_SINGLE;
  const fedTax=calcTax(taxableIncome, brackets);
  const caTax=calcTax(taxableIncome, CA_BRACKETS_SINGLE);
  const caSDI=Math.min(grossIncome*0.009,1378.48); // CA SDI 2024 cap
  const totalTax=fedTax+seTax+caTax+caSDI;
  const effectiveRate=grossIncome>0?totalTax/grossIncome:0;

  return{
    grossIncome, deductionAmt, seDeduction, agi, taxableIncome,
    fedTax, seTax, caTax, caSDI, totalTax, effectiveRate,
    netIncome:grossIncome-totalTax,
    perDollar:effectiveRate,
    quarterly:totalTax/4,
  };
}

function renderTaxes(){
  const p=document.getElementById('pg-taxes');
  const settings=loadTaxSettings();
  const taxPayments=loadTaxPayments();
  const now=new Date();
  const yr=now.getFullYear();

  // Get YTD income from tracker
  const ytdTxns=DB.txns.filter(t=>{
    const d=new Date(t.date);
    return d.getFullYear()===yr&&t.catType==='income';
  });
  const ytdIncome=ytdTxns.reduce((s,t)=>s+t.amount,0);
  const ytdBizIncome=ytdTxns.filter(t=>t.type==='business').reduce((s,t)=>s+t.amount,0);

  // Project annual income
  const dayOfYear=Math.floor((now-new Date(yr,0,0))/(1000*60*60*24));
  const projectedAnnual=dayOfYear>0?Math.round(ytdIncome/dayOfYear*365):0;

  // YTD expenses (deductible business expenses)
  const ytdBizExp=DB.txns.filter(t=>{
    const d=new Date(t.date);
    return d.getFullYear()===yr&&t.catType==='expense'&&t.type==='business';
  }).reduce((s,t)=>s+t.amount,0);
  const netBizIncome=Math.max(0,ytdBizIncome-ytdBizExp);

  // Calculate taxes on projected annual
  const ytdTax=calcAllTaxes(ytdIncome, settings);
  const projTax=calcAllTaxes(projectedAnnual, settings);

  // Tax already paid this year
  const paidTax=taxPayments.filter(p=>p.year===yr).reduce((s,p)=>s+p.amount,0);
  const stillOwed=Math.max(0,ytdTax.totalTax-paidTax);

  // Quarterly deadlines 2025
  const quarters=[
    {q:'Q1 2025',deadline:'Apr 15, 2025',months:'Jan–Mar'},
    {q:'Q2 2025',deadline:'Jun 16, 2025',months:'Apr–May'},
    {q:'Q3 2025',deadline:'Sep 15, 2025',months:'Jun–Aug'},
    {q:'Q4 2025',deadline:'Jan 15, 2026',months:'Sep–Dec'},
  ];
  const nextDeadline=quarters.find(q=>new Date(q.deadline)>=now)||quarters[3];

  p.innerHTML=`
  <style>

function txMarkPaid(quarter, year){
  const amt=parseFloat(prompt('Сколько заплатил в Q'+quarter+' '+year+' ($)?'));
  if(!amt||amt<=0) return;
  const payments=loadTaxPayments();
  const existing=payments.find(p=>p.quarter===quarter&&p.year===year);
  if(existing){ existing.amount=amt; }
  else { payments.push({id:Date.now(),quarter,year,amount:amt,date:localDateStr()}); }
  saveTaxPayments(payments);
  renderTaxes();
  alert('✅ Записано: Q'+quarter+' '+year+' — $'+amt.toFixed(2));
}

function txSaveSettings(){
  const s=loadTaxSettings();
  s.filingStatus=(document.getElementById('tx_status')||{}).value||s.filingStatus;
  s.deductions=(document.getElementById('tx_ded')||{}).value||s.deductions;
  saveTaxSettings(s);
  renderTaxes();
}

function renderForecast(){
  const p=document.getElementById('pg-forecast');
  const now=new Date();
  const yr=now.getFullYear();
  const mo=now.getMonth();

  // ── Исторические данные (последние 6 месяцев) ──
  const history=[];
  for(let i=5;i>=0;i--){
    const d=new Date(yr,mo-i,1);
    const m=d.getMonth(), y=d.getFullYear();
    const txns=DB.txns.filter(t=>{const td=new Date(t.date);return td.getMonth()===m&&td.getFullYear()===y;});
    const inc=txns.filter(t=>t.catType==='income').reduce((s,t)=>s+t.amount,0);
    const exp=txns.filter(t=>t.catType==='expense').reduce((s,t)=>s+t.amount,0);
    history.push({m,y,label:d.toLocaleDateString('ru-RU',{month:'short',year:'2-digit'}),inc,exp,net:inc-exp});
  }

  // ── Средние значения ──
  const activeMos=history.filter(h=>h.inc>0||h.exp>0);
  const avgInc=activeMos.length?activeMos.reduce((s,h)=>s+h.inc,0)/activeMos.length:0;
  const avgExp=activeMos.length?activeMos.reduce((s,h)=>s+h.exp,0)/activeMos.length:0;
  const avgNet=avgInc-avgExp;

  // ── Обязательные платежи из календаря ──
  const bills=pcLoad();
  const fixedExp=bills.filter(b=>b.type!=='save').reduce((s,b)=>s+b.amount,0);
  const fixedSave=bills.filter(b=>b.type==='save').reduce((s,b)=>s+b.amount,0);
  const fixedSubs=DB.subs.filter(s=>s.active).reduce((s,sub)=>s+sub.amount,0);
  const totalFixed=fixedExp+fixedSubs;

  // ── Текущий месяц прогресс ──
  const today=new Date();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const daysPassed=today.getDate();
  const monthPct=daysPassed/daysInMonth;
  const curMonthTxns=DB.txns.filter(t=>{const d=new Date(t.date);return d.getMonth()===mo&&d.getFullYear()===yr;});
  const curInc=curMonthTxns.filter(t=>t.catType==='income').reduce((s,t)=>s+t.amount,0);
  const curExp=curMonthTxns.filter(t=>t.catType==='expense').reduce((s,t)=>s+t.amount,0);
  const projCurInc=monthPct>0?Math.round(curInc/monthPct):avgInc;
  const projCurExp=Math.max(curExp, totalFixed);

  // ── Прогноз на 6 месяцев вперёд ──
  const forecast=[];
  let runningCash=DB.accounts.filter(a=>a.type!=='credit').reduce((s,a)=>s+a.balance,0);
  for(let i=0;i<6;i++){
    const d=new Date(yr,mo+i,1);
    const label=d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    const shortLabel=d.toLocaleDateString('ru-RU',{month:'short',year:'2-digit'});
    // Use actual for current month, projected for future
    const projInc=i===0?projCurInc:avgInc>0?avgInc:fixedExp*1.5;
    const projExpVar=i===0?projCurExp:avgExp>totalFixed?avgExp:totalFixed*1.1;
    const projNet=projInc-projExpVar-fixedSave;
    const taxReserve=projInc*(0.30); // 30% tax reserve
    const afterTax=projNet-taxReserve;
    runningCash+=projNet;
    forecast.push({
      label,shortLabel,projInc,projExpVar,projNet,taxReserve,afterTax,
      runningCash,
      isActual:i===0,
    });
  }

  // ── Сценарии ──
  const scenarios=[
    {name:'Пессимист',emoji:'😟',incMult:0.7,color:'#EF4444'},
    {name:'Реалист',  emoji:'😐',incMult:1.0,color:'#F59E0B'},
    {name:'Оптимист', emoji:'😊',incMult:1.3,color:'#10B981'},

  .fc-row:last-child{border-bottom:none}

  .fc-bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}

  .fc-b{flex:1;border-radius:3px 3px 0 0;min-height:2px}

  <!-- HEADER -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
    ${kpi('Ср. доход/мес',fmt$(avgInc),'последние '+activeMos.length+' мес','#10B981')}
    ${kpi('Ср. расход/мес',fmt$(avgExp),'переменные','#EF4444')}
    ${kpi('Фикс. обязательства',fmt$(totalFixed),'платежи + подписки','#F97316')}
    ${kpi('Ср. чистый поток',fmt$(avgNet),avgNet>=0?'✓ положительный':'✗ отрицательный',avgNet>=0?'#10B981':'#EF4444')}

  <div style="display:grid;grid-template-columns:1fr 300px;gap:14px">
    <div>

      <!-- BAR CHART -->
      <div class="fc-card">
        <div style="font-size:13px;font-weight:700;margin-bottom:14px">📈 Прогноз денежного потока — 6 месяцев</div>
        <div class="fc-bar-wrap">
          ${forecast.map(f=>`<div class="fc-bar-group">
            <div class="fc-bars">
              <div class="fc-b" style="height:${Math.round(f.projInc/maxVal*90)}%;background:${f.isActual?'#059669':'#10B981'}" title="Доход ${fmt$(f.projInc)}"></div>
              <div class="fc-b" style="height:${Math.round(f.projExpVar/maxVal*90)}%;background:${f.isActual?'#DC2626':'#EF4444'}" title="Расход ${fmt$(f.projExpVar)}"></div>
            </div>
            <div class="fc-lbl">${f.shortLabel}${f.isActual?' *':''}</div>
          </div>`).join('')}
        </div>
        <div style="display:flex;gap:14px;font-size:10px;margin-top:6px;color:var(--muted)">
          <span><span style="display:inline-block;width:10px;height:10px;background:#10B981;border-radius:2px;margin-right:3px"></span>Доход</span>

          <span style="color:var(--muted)">* текущий месяц (фактические + прогноз)</span>
        </div>
      </div>

      <!-- MONTHLY FORECAST TABLE -->
      <div class="fc-card">
        <div style="font-size:13px;font-weight:700;margin-bottom:12px">📋 Детальный прогноз по месяцам</div>
        <div style="overflow-x:auto"><table>

        <div class="fc-row"><span style="font-size:12px">Доход (прогноз)</span><span style="font-weight:700;color:#059669">${fmt$(projCurInc)}</span></div>
        <div class="fc-row"><span style="font-size:12px">Расход (факт)</span><span style="color:#EF4444">${fmt$(curExp)}</span></div>

function glPickIcon(el, icon){
  document.querySelectorAll('.gl-icon-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  const inp=document.getElementById('gl_icon');
  if(inp) inp.value=icon;
}

function glSave(){
  const name=(document.getElementById('gl_name')||{}).value?.trim();
  const target=parseFloat((document.getElementById('gl_target')||{}).value);
  if(!name||!target||target<=0){alert('Введи название и сумму цели');return;}
  const goals=loadGoals();
  goals.push({
    id:Date.now(),
    name, target,
    saved:parseFloat((document.getElementById('gl_saved')||{}).value)||0,
    monthlyContrib:parseFloat((document.getElementById('gl_contrib')||{}).value)||0,
    deadline:(document.getElementById('gl_deadline')||{}).value||'',
    category:(document.getElementById('gl_cat')||{}).value||'Накопление',
    icon:(document.getElementById('gl_icon')||{}).value||'🎯',
    color:(document.getElementById('gl_color')||{}).value||'#0EA5E9',
    note:(document.getElementById('gl_note')||{}).value||'',
    created:localDateStr(),
    deposits:[],
  });
  saveGoals(goals);
  document.getElementById('gl-form-wrap').innerHTML='';
  renderGoals();
}

function glDeposit(id){
  const amt=parseFloat(prompt('Сколько добавить к цели ($)?'));
  if(!amt||amt<=0) return;
  const goals=loadGoals();
  const g=goals.find(x=>x.id===id);
  if(!g) return;
  g.saved+=amt;
  if(!g.deposits) g.deposits=[];
  g.deposits.push({amt,date:localDateStr()});
  saveGoals(goals);
  renderGoals();
  if(g.saved>=g.target) setTimeout(()=>alert('🎉 Поздравляем! Цель "'+g.name+'" достигнута!'),200);
}

function glEdit(id){
  const goals=loadGoals();
  const g=goals.find(x=>x.id===id);
  if(!g) return;
  const newTarget=parseFloat(prompt('Новая сумма цели ($):',g.target));
  if(!newTarget||newTarget<=0) return;
  g.target=newTarget;
  saveGoals(goals);
  renderGoals();
}

function glDelete(id){
  if(!confirm('Удалить цель?')) return;
  saveGoals(loadGoals().filter(g=>g.id!==id));
  renderGoals();
}

function glQuickCreate(name,target,icon,color){
  glShowForm({name,target,icon,color});
}

let _backupTimer=null;
function scheduleAutoBackup(){clearTimeout(_backupTimer);_backupTimer=setTimeout(silentBackup,3000);}

function silentBackup(){
  try{
    const data={txns:DB.txns,subs:DB.subs,accounts:DB.accounts,exported:new Date().toISOString(),auto:true};
    const rq=indexedDB.open('fintracker_backup',1);
    rq.onupgradeneeded=e=>e.target.result.createObjectStore('backup');
    rq.onsuccess=e=>{
      try{
        const tx=e.target.result.transaction('backup','readwrite');
        tx.objectStore('backup').put(JSON.stringify(data),'latest');
        tx.objectStore('backup').put(new Date().toISOString(),'lastSaved');
        const el=document.getElementById('_save_status');
        if(el)el.textContent='💾 '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      }catch(e){}
    };
  }catch(e){}
}

function manualBackup(){
  const data={txns:DB.txns,subs:DB.subs,accounts:DB.accounts,exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='fintracker-'+localDateStr()+'.json';a.click();
  const el=document.getElementById('_save_status');
  if(el)el.textContent='✅ скачан '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}

function restoreFromFile(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.txns&&!d.accounts){alert('Неверный формат');return;}
        if(!confirm('Загрузить данные? Текущие будут заменены.'))return;
        if(d.txns){DB.txns=d.txns;_set('ft_txns',d.txns);}
        if(d.subs){DB.subs=d.subs;_set('ft_subs',d.subs);}
        if(d.accounts){DB.accounts=d.accounts;_set('ft_accounts',d.accounts);}
        saveDB(DB);alert('✅ Данные восстановлены!');location.reload();
      }catch(err){alert('Ошибка: '+err);}
    };
    reader.readAsText(file);
  };
  input.click();
}

// Сохраняем при закрытии вкладки
window.addEventListener('beforeunload',()=>silentBackup());

// При загрузке — проверяем есть ли бэкап если данные пустые
function checkBackupOnLoad(){
  if(DB.txns.length>0)return; // данные есть — всё хорошо
  try{
    const rq=indexedDB.open('fintracker_backup',1);
    rq.onupgradeneeded=e=>e.target.result.createObjectStore('backup');
    rq.onsuccess=e=>{
      try{
        const r=e.target.result.transaction('backup','readonly').objectStore('backup').get('latest');
        r.onsuccess=()=>{
          if(!r.result)return;
          try{
            const d=JSON.parse(r.result);
            if(d.txns&&d.txns.length>0){
              if(confirm('🔄 Найдена резервная копия от '+new Date(d.exported).toLocaleString('ru-RU')+'\nВосстановить данные?')){
                DB.txns=d.txns;_set('ft_txns',d.txns);
                DB.subs=d.subs;_set('ft_subs',d.subs);
                DB.accounts=d.accounts;_set('ft_accounts',d.accounts);
                saveDB(DB);renderDash();renderAlerts();
              }
            }
          }catch(e){}
        };
      }catch(e){}
    };
  }catch(e){}
}

document.addEventListener('DOMContentLoaded',()=>{
  const bar=document.querySelector('.topbar > div:last-child');
  if(!bar)return;
  const status=document.createElement('span');
  status.id='_save_status';
  status.style.cssText='font-size:10px;color:#6c757d;';
  status.textContent='💾 авто';

  const btnBackup=document.createElement('button');
  btnBackup.className='btn btn-sm';
  btnBackup.style.cssText='background:#F0FDF4;border-color:#10B981;color:#065F46;';
  btnBackup.textContent='💾 Бэкап';
  btnBackup.onclick=manualBackup;

  const btnRestore=document.createElement('button');
  btnRestore.className='btn btn-sm';
  btnRestore.style.cssText='background:#EFF6FF;border-color:#0EA5E9;color:#1D4ED8;';
  btnRestore.textContent='📂 Загрузить';
  btnRestore.onclick=restoreFromFile;

  bar.prepend(status);
  bar.prepend(btnBackup);
  bar.prepend(btnRestore);
});

setTimeout(checkBackupOnLoad,1500);
// ============================================================

_loadFromIDB(()=>{DB=loadDB();renderDash();renderAlerts();checkBackupOnLoad();});
</script>
</body>
</html>
